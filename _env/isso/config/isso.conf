[general]
dbpath = /rw/db/comments.db
host =
    http://duckpond.ch
    https://duckpond.ch
notify = smtp

[server]
listen = http://blog-isso:8080

[moderation]
enabled = true
purge-after = 30d

[smtp]
host = postfix
port = 25
security = none
to = isso@duckpond.ch
from = isso@duckpond.ch
timeout = 10

[hash]
salt = sawighohC8iewee7ohCh

[markup]

# Customize markup and sanitized HTML. Markdown is rendered via mistune or
# misaka. Pinned explicitly: isso 0.14 ships `renderer = mistune` in its own
# defaults, so leaving this unset silently switches the engine (and ignores
# any misaka `options` left in this section). Keeping misaka preserves
# existing comment rendering; moving to mistune is a separate decision, since
# it changes how all existing comments render.
renderer = misaka

# Additional HTML tags to allow in the generated output, comma-separated. By
# default, only a, blockquote, br, code, del, em, h1, h2, h3, h4, h5, h6, hr,
# ins, li, ol, p, pre, strong, table, tbody, td, th, thead and ul are allowed.
allowed-elements =

# Additional HTML attributes (independent from elements) to allow in the
# generated output, comma-separated. By default, only align and href are
# allowed.
allowed-attributes =

[markup.misaka]

# As of isso 0.14 the misaka-specific `options` and `flags` keys live in this
# section; left in [markup] they are silently ignored. Values below are the
# previous settings, kept verbatim so rendering does not change (isso's own
# default for this key additionally enables `superscript`).
#
# Misaka-specific Markdown extensions, all flags starting with EXT_ can be used
# there, separated by comma.
options = strikethrough, autolink, fenced-code, no-intra-emphasis

# Misaka-specific HTML rendering flags, all html rendering flags can be used
# here, separated by comma, either by their name or as HTML_<flag>.
# Per Misaka's defaults, no flags are set.
flags =
